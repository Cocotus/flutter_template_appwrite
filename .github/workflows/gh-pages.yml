name: Deploy web to GitHub Pages

# Builds and publishes a backend-free demo build (DEMO_MODE_ALLOWED=true) to
# GitHub Pages. See README §11.
#
# Unlike a freeware fork (HAS_LOGIN=false), this template's own defaults are
# HAS_LOGIN=true / HAS_PREMIUM=true — i.e. it ships expecting a real
# Appwrite backend. To showcase the template publicly without one, this
# workflow leaves those defaults untouched and only adds the demo-mode
# escape hatch, so visitors see the real login screen and flip its Demo
# mode switch (fake in-memory auth + data, no network calls).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1

# Only one deployment at a time; a newer push cancels an older run still
# building so it can never overwrite the newer one after it finishes.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build web (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # flutter build web bakes this into build/web/version.json, which
      # appVersionProvider reads at runtime and shows on the login screen.
      - name: Bump build number to ${{ github.run_number }}
        run: |
          sed -i -E "s/^(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Build web
        run: >
          flutter build web --release
          --base-href=/${{ github.event.repository.name }}/
          --dart-define=DEMO_MODE_ALLOWED=true
      # GitHub Pages runs Jekyll by default, which drops dotfiles/underscore
      # paths. This app has none load-bearing, but it's cheap insurance.
      - run: touch build/web/.nojekyll
      # SPA fallback: main.dart calls usePathUrlStrategy(), so a direct
      # load of e.g. /flutter_template_appwrite/settings must still return
      # content — GitHub Pages serves 404.html for unknown paths, so make
      # that content identical to index.html and let go_router take over
      # client-side once the app has loaded.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
