name: Release

# Manually triggered desktop release: builds Linux and Windows in parallel,
# packages each as a ZIP, and creates a GitHub Release with both ZIPs
# attached and auto-generated release notes.
#
# How to trigger:
#   GitHub → Actions tab → Release → Run workflow
#   → enter the version number (e.g. 1.0.1)
#   → optionally check "Mark as pre-release"
#
# The ZIP filenames are derived from the repository name automatically, so a
# fork does not need to edit this workflow just to rename the artifacts.
#
# Prerequisite: config/app_config.json must be committed to the repo (or the
# --dart-define-from-file flag on both build steps must be adapted). This is
# the same requirement as for gh-pages.yml — see README §6 and §11.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number e.g. 1.0.0
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

env:
  # Keep in sync with the Flutter version used in ci.yml.
  FLUTTER_VERSION: 3.44.1

# Required so the publish job can create tags and releases using the
# built-in GITHUB_TOKEN without a personal access token.
permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Ubuntu 24.04 (Noble): libwebkit2gtk-4.1-dev (NOT 4.0) plus
      # libsecret-1-dev for flutter_secure_storage. zip is needed for
      # the packaging step below.
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev \
            zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Riverpod/Freezed/JSON codegen must run before the build so that all
      # generated .g.dart / .freezed.dart files are up to date.
      - name: Generate code (Riverpod/Freezed/JSON)
        run: dart run build_runner build
      - name: Build Linux release
        run: flutter build linux --release --dart-define-from-file=config/app_config.json
      # install.sh expects to run from the directory containing bundle/, not
      # from inside it (see its own directory check), so it is copied
      # alongside bundle/ here, not into it.
      - name: Copy install script
        run: |
          cp install.sh build/linux/x64/release/
          chmod +x build/linux/x64/release/install.sh
      # Package the self-contained bundle plus install.sh as a ZIP.
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release
          zip -r ../../../../${{ github.event.repository.name }}-linux-v${{ github.event.inputs.version }}.zip bundle/ install.sh
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: ${{ github.event.repository.name }}-linux-v${{ github.event.inputs.version }}.zip
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Riverpod/Freezed/JSON codegen must run before the build so that all
      # generated .g.dart / .freezed.dart files are up to date.
      - name: Generate code (Riverpod/Freezed/JSON)
        run: dart run build_runner build
      - name: Build Windows release
        run: flutter build windows --release --dart-define-from-file=config/app_config.json
      # install.bat expects to run from inside the runner output folder (it
      # xcopies "*" from its own directory), so it is copied there, not
      # alongside it.
      - name: Copy install script
        shell: pwsh
        run: Copy-Item install.bat build\windows\x64\runner\Release\
      # Package the runner output folder (including install.bat) as a ZIP.
      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath ${{ github.event.repository.name }}-windows-v${{ github.event.inputs.version }}.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ github.event.repository.name }}-windows-v${{ github.event.inputs.version }}.zip
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: linux-zip
      - name: Download Windows artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: windows-zip
      # Creates the GitHub Release, attaches both ZIPs, and auto-generates
      # release notes from merged pull requests and commits since the
      # previous tag. The tag (v<version>) is created here if it does not
      # exist yet — that is why permissions: contents: write is required.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ${{ github.event.repository.name }} v${{ github.event.inputs.version }}
          files: |
            ${{ github.event.repository.name }}-linux-v${{ github.event.inputs.version }}.zip
            ${{ github.event.repository.name }}-windows-v${{ github.event.inputs.version }}.zip
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
