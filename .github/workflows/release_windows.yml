name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number e.g. 1.0.0
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: 3.44.1

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and release Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          Copy-Item install.bat build\windows\x64\runner\Release\
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath app-windows-v${{ github.event.inputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: app v${{ github.event.inputs.version }} (Windows)
          files: app-windows-v${{ github.event.inputs.version }}.zip
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
