name: Release Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number e.g. 1.0.0
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: 3.44.1

permissions:
  contents: write

jobs:
  release-linux:
    name: Build and release Linux ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libblkid-dev liblzma-dev pkg-config cmake clang \
            libsecret-1-dev libwebkit2gtk-4.1-dev zip

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          chmod +x install.sh
          cp install.sh build/linux/x64/release/bundle/
          cd build/linux/x64/release
          zip -r ../../../../app-linux-v${{ github.event.inputs.version }}.zip bundle/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: app v${{ github.event.inputs.version }} (Linux)
          files: app-linux-v${{ github.event.inputs.version }}.zip
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
