name: AI Translate ARB

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require ARB AI API key
        run: |
          if [ -z "${ARB_AI_API_KEY}" ]; then
            echo "Missing ARB_AI_API_KEY secret."
            exit 1
          fi
        env:
          ARB_AI_API_KEY: ${{ secrets.ARB_AI_API_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install arb_ai
        run: dart pub global activate arb_ai

      - name: Translate missing keys
        run: dart pub global run arb_ai
        env:
          ARB_AI_API_KEY: ${{ secrets.ARB_AI_API_KEY }}

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Create translation PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(l10n): update ARB translations via arb_ai"
          title: "chore(l10n): update ARB translations via arb_ai"
          body: |
            Automated ARB translation update generated by `arb_ai`.
          branch: chore/arb-ai-translation-update
          delete-branch: true
